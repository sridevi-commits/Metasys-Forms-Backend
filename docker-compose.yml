
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: metasys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: metasys
      POSTGRES_PASSWORD: sri_123      
      POSTGRES_DB: metasys_forms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - metasys-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: metasys-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - metasys-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: metasys-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - metasys-network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metasys-forms-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://metasys:sri_123@postgres:5432/metasys_forms
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - metasys-network
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  metasys-network:
    driver: bridge